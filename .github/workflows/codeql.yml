name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '31 7 * * 3'

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            packs: ''
          - language: go
            build-mode: autobuild
            packs: codeql/go-queries:AlertSuppression.ql
          - language: javascript-typescript
            build-mode: none
            packs: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          packs: ${{ matrix.packs }}

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
          # Upload the processed SARIF below. This keeps source suppressions out
          # of PR results without changing repository-global alert state.
          upload: failure-only

      - name: Filter source suppressions
        if: matrix.language == 'go'
        shell: bash
        run: |
          set -euo pipefail
          found=false
          while IFS= read -r -d '' sarif; do
            found=true
            filtered="${sarif}.filtered"
            jq '(.runs[] | select(.results != null) | .results) |= map(select(((.suppressions // []) | length) == 0))' \
              "$sarif" > "$filtered"
            mv "$filtered" "$sarif"
          done < <(find sarif-results -type f \( -name '*.sarif' -o -name '*.sarif.json' \) -print0)
          if [[ "$found" != true ]]; then
            echo "No SARIF files found" >&2
            exit 1
          fi

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v4
        with:
          category: /language:${{ matrix.language }}
          sarif_file: sarif-results
          wait-for-processing: true
