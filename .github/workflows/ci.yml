name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect Go changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go:
              - '**/*.go'
              - 'assets/emails/**'
              - 'assets/migrations_postgres/**'
              - 'assets/migrations_sqlite/**'
              - 'enterprise/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'

      - name: No Go test changes
        if: steps.changes.outputs.go != 'true'
        run: echo "No Go/backend changes detected; skipping Go tests."

      - name: Set up Go
        if: steps.changes.outputs.go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        if: steps.changes.outputs.go == 'true'
        run: go test -race -buildvcs ./...

      - name: Run Go tests (enterprise)
        if: steps.changes.outputs.go == 'true'
        run: go test -race -buildvcs -tags enterprise ./...

  go-quality:
    name: Go Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect Go quality changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'assets/migrations_postgres/**'
              - 'assets/migrations_sqlite/**'
              - 'enterprise/**'
              - 'Makefile'

      - name: No Go quality changes
        if: steps.changes.outputs.go != 'true'
        run: echo "No Go/module changes detected; skipping Go quality checks."

      - name: Set up Go
        if: steps.changes.outputs.go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check module files
        if: steps.changes.outputs.go == 'true'
        run: go mod tidy -diff

      - name: Verify modules
        if: steps.changes.outputs.go == 'true'
        run: go mod verify

      - name: Check formatting
        if: steps.changes.outputs.go == 'true'
        run: test -z "$(gofmt -l .)"

      - name: Run go vet
        if: steps.changes.outputs.go == 'true'
        run: go vet ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect frontend changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'

      - name: No frontend changes
        if: steps.changes.outputs.frontend != 'true'
        run: echo "No frontend changes detected; skipping frontend tests and build."

      - name: Set up Bun
        if: steps.changes.outputs.frontend == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install frontend dependencies
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Check frontend formatting
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: bun run format:check

      - name: Lint frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: bun run lint

      - name: Type-check frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: bun run typecheck

      - name: Run frontend tests
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: bun run test

      - name: Build frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: bun run build

      - name: Community bundle must not contain enterprise module
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: '! grep -Rq "sqlwarden-enterprise-bundle" ../assets/static'

      - name: Build enterprise frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: bun run build:enterprise

      - name: Enterprise bundle must contain enterprise module
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: grep -Rq 'sqlwarden-enterprise-bundle' ../assets/static

  edition-guards:
    name: Edition Guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build community binary
        run: go build -o /tmp/sqlwarden-ce ./cmd/api

      - name: Community binary must not contain enterprise code
        run: ./scripts/check-ce-binary.sh /tmp/sqlwarden-ce

      - name: Build enterprise binary
        run: go build -tags enterprise -o /tmp/sqlwarden-ee ./cmd/api

      - name: Enterprise binary must contain enterprise code
        run: |
          count=$(grep -a -c 'sqlwarden/enterprise' /tmp/sqlwarden-ee || true)
          if [ "$count" -eq 0 ]; then
            echo "FAIL: enterprise binary contains no enterprise package references" >&2
            exit 1
          fi

  dependency-licenses:
    name: Dependency Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go dependency licenses
        run: |
          go install github.com/google/go-licenses@v1.6.0
          go-licenses check ./... --disallowed_types=forbidden,restricted --ignore github.com/sqlwarden

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Check frontend dependency licenses
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bunx license-checker --production --excludePrivatePackages \
            --failOn "GPL-2.0;GPL-3.0;AGPL-1.0;AGPL-3.0;LGPL-2.0;LGPL-2.1;LGPL-3.0"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect Docker build changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'cmd/**'
              - 'internal/**'
              - 'pkg/**'
              - 'assets/**'
              - 'frontend/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'

      - name: No Docker build changes
        if: steps.changes.outputs.docker != 'true'
        run: echo "No Docker build input changes detected; skipping Docker build."

      - name: Set up Docker Buildx
        if: steps.changes.outputs.docker == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: steps.changes.outputs.docker == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: sqlwarden/sqlwarden:ci

      - name: Build enterprise image
        if: steps.changes.outputs.docker == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          build-args: |
            EDITION=enterprise
          tags: sqlwarden/sqlwarden-ee:ci

      - name: Verify image editions
        if: steps.changes.outputs.docker == 'true'
        run: |
          docker run --rm --entrypoint sh sqlwarden/sqlwarden:ci -c \
            "! grep -aq 'github.com/sqlwarden/enterprise' /app/sqlwarden && \
             ! grep -aq 'sqlwarden-enterprise-bundle' /app/sqlwarden"
          docker run --rm --entrypoint sh sqlwarden/sqlwarden-ee:ci -c \
            "grep -aq 'github.com/sqlwarden/enterprise' /app/sqlwarden && \
             grep -aq 'sqlwarden-enterprise-bundle' /app/sqlwarden"
