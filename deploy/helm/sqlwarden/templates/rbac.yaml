{{- if .Values.rbac.create }}
{{/* SQLWarden never calls the Kubernetes API, so every role grants nothing. */}}
{{- if .Values.api.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sqlwarden.api.fullname" . }}
  labels:
    {{- include "sqlwarden.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sqlwarden.api.fullname" . }}
  labels:
    {{- include "sqlwarden.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sqlwarden.api.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sqlwarden.api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
{{- end }}
{{- if .Values.connector.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sqlwarden.connector.fullname" . }}
  labels:
    {{- include "sqlwarden.labels" . | nindent 4 }}
    app.kubernetes.io/component: connector
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sqlwarden.connector.fullname" . }}
  labels:
    {{- include "sqlwarden.labels" . | nindent 4 }}
    app.kubernetes.io/component: connector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sqlwarden.connector.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sqlwarden.connector.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
{{- end }}
{{- if .Values.migration.enabled }}
{{/* Secret projection is performed by the kubelet and needs no API grant. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sqlwarden.migration.fullname" . }}
  labels:
    {{- include "sqlwarden.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sqlwarden.migration.fullname" . }}
  labels:
    {{- include "sqlwarden.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sqlwarden.migration.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sqlwarden.migration.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
