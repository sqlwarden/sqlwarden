{{- if .Values.serviceAccount.create }}
{{- if .Values.api.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sqlwarden.api.serviceAccountName" . }}
  labels:
    {{- include "sqlwarden.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# SQLWarden never calls the Kubernetes API, so no process kind needs a mounted
# token. Each kind still gets its own ServiceAccount so cluster policy can tell
# the control plane and the data plane apart.
automountServiceAccountToken: false
{{- end }}
{{- if .Values.connector.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sqlwarden.connector.serviceAccountName" . }}
  labels:
    {{- include "sqlwarden.labels" . | nindent 4 }}
    app.kubernetes.io/component: connector
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.migration.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sqlwarden.migration.serviceAccountName" . }}
  labels:
    {{- include "sqlwarden.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
