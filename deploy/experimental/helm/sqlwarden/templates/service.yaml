{{- $component := include "sqlwarden.serving.component" . }}
{{- $cfg := index .Values $component }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sqlwarden.serving.fullname" . }}
  labels:
    {{- include "sqlwarden.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $cfg.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $cfg.service.type }}
  ports:
    - name: http
      port: {{ $cfg.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "sqlwarden.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
